[project]
name = "context-desk"
version = "0.1.0"
description = "Local desktop web app for AI context management"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "reflex",
    "pyyaml",
    "jinja2",
    "fastmcp",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]